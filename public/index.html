<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housemaster — Snap & Sort</title>
<style>
  :root {
    --bg:#f5f4f1; --card:#fff; --ink:#1c1b19; --sub:#6b6862;
    --accent:#b5651d; --line:#e5e2dc; --good:#3a7d44; --later:#6b6862; --warn:#b5651d; --danger:#b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --card:#221f1c; --ink:#f0ede7; --sub:#a39d92; --line:#34302b; }
  }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; padding:20px 16px 60px; }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .streak { color:var(--sub); font-size:.9rem; margin-bottom:20px; }
  .capture-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:center; margin-bottom:20px; }
  .snap-btn { display:inline-flex; align-items:center; justify-content:center; width:88px; height:88px; border-radius:50%; background:var(--accent); color:#fff; font-size:2rem; cursor:pointer; user-select:none; border:none; }
  .snap-btn:active { transform:scale(.96); }
  #fileInput { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
  .camera-overlay { position:fixed; inset:0; background:#000; display:none; z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
  .camera-overlay.show { display:flex; }
  .camera-overlay video { width:100%; height:100%; object-fit:cover; }
  .camera-controls { position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:40px; padding:24px 20px calc(24px + env(safe-area-inset-bottom, 0px)); background:linear-gradient(transparent, rgba(0,0,0,.6)); }
  .cam-shutter { width:72px; height:72px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,.5); cursor:pointer; }
  .cam-shutter:active { transform:scale(.94); }
  .cam-cancel, .cam-switch { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .hint { color:var(--sub); font-size:.85rem; margin-top:10px; }
  .result-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:20px; display:none; }
  .result-card.show { display:block; }
  .result-photo { width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:12px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:.75rem; color:var(--sub); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
  .field input[type="text"], .field select, .field input[type="number"] {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:.95rem;
  }
  .row2 { display:flex; gap:10px; }
  .row2 .field { flex:1; }
  .reasoning { color:var(--sub); font-size:.85rem; margin-bottom:14px; }
  .dup-warning { background:rgba(181,101,29,.12); color:var(--warn); border:1px solid rgba(181,101,29,.3); border-radius:10px; padding:8px 10px; font-size:.82rem; margin-bottom:12px; }
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .action-btn { padding:12px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:.9rem; cursor:pointer; width:100%; }
  .action-btn.confirm { background:var(--good); color:#fff; border-color:var(--good); }
  .action-btn.misc { background:var(--accent); color:#fff; border-color:var(--accent); }
  .action-btn.later { background:var(--later); color:#fff; border-color:var(--later); }
  .action-btn.cancel { background:transparent; color:var(--danger); border-color:var(--danger); }
  .loading { color:var(--sub); font-size:.9rem; padding:10px 0; }
  .log h2 { font-size:1rem; color:var(--sub); font-weight:600; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; row-gap:6px; }
  .log h2 .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .link-btn { background:none; border:none; color:var(--accent); font-size:.78rem; cursor:pointer; padding:2px 4px; white-space:nowrap; }
  .search-box { width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:.85rem; margin-bottom:12px; }
  .log-item { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .log-item img { width:44px; height:44px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .log-item .meta { flex:1 1 160px; min-width:0; overflow-wrap:anywhere; }
  .log-item .time { color:var(--sub); font-size:.75rem; }
  .log-item .row-actions { display:flex; gap:6px; align-items:center; flex-shrink:0; margin-left:auto; }
  .icon-btn { background:none; border:none; cursor:pointer; font-size:.9rem; padding:4px; color:var(--sub); }
  .status-pill { font-size:.7rem; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .status-pill.confirmed { background:rgba(58,125,68,.15); color:var(--good); }
  .status-pill.misc { background:rgba(181,101,29,.15); color:var(--accent); }
  .status-pill.later { background:rgba(107,104,98,.15); color:var(--later); }
  .empty { color:var(--sub); font-size:.85rem; text-align:center; padding:20px 0; }
  .edit-row { display:flex; gap:6px; flex-wrap:wrap; flex:1 1 100%; align-items:center; }
  .edit-row input, .edit-row select { padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:.82rem; max-width:100%; }
  .edit-row input[type="text"] { flex:1 1 140px; min-width:0; }
  .split-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 20px; margin-bottom:20px; }
  .split-card select { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .bin-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .bin-chip { padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:.85rem; cursor:pointer; }
  .bin-chip.active { outline:2px solid var(--accent); font-weight:600; }
  .bin-chip.add { border-style:dashed; color:var(--sub); }
  .bin-chip.disabled { opacity:.4; cursor:not-allowed; }
  .batch-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:20px; display:none; }
  .batch-card.show { display:block; }
  .batch-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .batch-row input[type="text"] { flex:1 1 auto; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .batch-row input[type="number"] { width:56px; padding:8px 6px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .search-row { display:flex; gap:8px; align-items:center; }
  .search-row .search-box { flex:1 1 auto; }
  .search-row .link-btn { flex-shrink:0; white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Housemaster — Snap & Sort</h1>
  <div class="streak" id="streakLine">Loading…</div>

  <div class="capture-card">
    <button class="snap-btn" id="snapBtn" type="button">📷</button>
    <div class="hint">Tap to photograph an item</div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
  </div>

  <div class="camera-overlay" id="cameraOverlay">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="camera-controls">
      <button class="cam-cancel" id="camCancelBtn" type="button" aria-label="Cancel">✕</button>
      <button class="cam-shutter" id="camShutterBtn" type="button" aria-label="Take photo"></button>
      <button class="cam-switch" id="camSwitchBtn" type="button" aria-label="Switch camera">⟲</button>
    </div>
  </div>

  <div class="split-card">
    <button class="link-btn" id="splitToggleBtn">🗂 Split a box into bins</button>
    <div id="splitPanel" style="display:none;margin-top:10px;">
      <div class="field">
        <label for="familyPicker">Box to split</label>
        <select id="familyPicker"></select>
      </div>
      <div class="field">
        <label>Bins in this box (up to 5)</label>
        <div class="bin-chips" id="binChips"></div>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="action-btn confirm" id="binPhotoBtn" disabled>📷 Photo this bin's items</button>
      </div>
      <div class="hint" id="binHint" style="margin-top:6px;"></div>
    </div>
  </div>

  <div class="batch-card" id="batchCard">
    <div class="hint" id="batchTargetLabel" style="margin-bottom:10px;"></div>
    <div id="batchRows"></div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="action-btn confirm" id="batchSaveBtn">✓ Save all to this bin</button>
      <button class="action-btn cancel" id="batchCancelBtn">Cancel</button>
    </div>
  </div>

  <div class="result-card" id="resultCard">
    <img class="result-photo" id="resultPhoto" alt="captured item">
    <div id="loadingLine" class="loading" style="display:none;">Sorting…</div>
    <div id="resultBody" style="display:none;">
      <div id="dupWarning" class="dup-warning" style="display:none;"></div>
      <div class="field">
        <label for="itemNameInput">Item name</label>
        <input type="text" id="itemNameInput" placeholder="Item name">
      </div>
      <div class="row2">
        <div class="field">
          <label for="boxPicker">Box</label>
          <select id="boxPicker"></select>
        </div>
        <div class="field" style="max-width:90px;">
          <label for="qtyInput">Qty</label>
          <input type="number" id="qtyInput" min="1" value="1">
        </div>
      </div>
      <div class="reasoning" id="reasoning"></div>
      <div class="btn-row">
        <button class="action-btn confirm" id="confirmBtn">✓ Confirm</button>
        <button class="action-btn misc" id="miscBtn">General</button>
        <button class="action-btn later" id="laterBtn">Check later</button>
        <button class="action-btn cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div class="log">
    <h2 id="logTitle">Recent
      <span class="actions">
        <button class="link-btn" id="toggleAllBtn">Show all</button>
        <button class="link-btn" id="toggleRemovedBtn">Removed items</button>
        <button class="link-btn" id="exportBtn">Export (color)</button>
      </span>
    </h2>
    <div class="search-row">
      <input type="text" class="search-box" id="searchInput" placeholder="Search items by name…">
      <button class="link-btn" id="lookupPhotoBtn" title="Find by photo">📷 Find by photo</button>
    </div>
    <div id="logList"><div class="empty">No items sorted yet.</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
const SUPABASE_URL = "https://clteinrzpebrkrkthsvx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsdGVpbnJ6cGVicmtya3Roc3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3ODU0MTUsImV4cCI6MjEwNTM2MTQxNX0.EO4rB4sMIEwLlUlec2Ep4MB9a47vF0r_zflUOzdJX9Y";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentFile = null, currentPhotoUrl = null, currentSuggestion = null, boxCache = [];
let selectedBinId = null, captureMode = 'single', batchDetected = [];
let showingRemoved = false;
let showingAll = false;

async function loadBoxes() {
  const { data } = await sb.from('boxes').select('*').order('id');
  boxCache = data || [];
  const picker = document.getElementById('boxPicker');
  const ordered = [];
  boxCache.filter(b => !b.parent_box_id).forEach(family => {
    ordered.push(family);
    boxCache.filter(b => b.parent_box_id === family.id).sort((a, b) => (a.bin_number || 0) - (b.bin_number || 0)).forEach(bin => ordered.push(bin));
  });
  picker.innerHTML = ordered.map(b => `<option value="${b.id}">${b.parent_box_id ? '↳ ' : (b.emoji ? b.emoji + ' ' : '')}${b.name}</option>`).join('');
  renderFamilyPicker();
}

function familyBoxes() {
  return boxCache.filter(b => !b.parent_box_id);
}

function binsFor(familyId) {
  return boxCache.filter(b => b.parent_box_id === familyId).sort((a, b) => (a.bin_number || 0) - (b.bin_number || 0));
}

function renderFamilyPicker() {
  const picker = document.getElementById('familyPicker');
  const prevValue = picker.value;
  picker.innerHTML = familyBoxes().map(b => `<option value="${b.id}">${b.emoji ? b.emoji + ' ' : ''}${b.name}</option>`).join('');
  if (prevValue && familyBoxes().some(b => String(b.id) === prevValue)) picker.value = prevValue;
  renderBinChips();
}

function renderBinChips() {
  const familyId = parseInt(document.getElementById('familyPicker').value, 10);
  const chips = document.getElementById('binChips');
  const hint = document.getElementById('binHint');
  const photoBtn = document.getElementById('binPhotoBtn');
  if (!familyId) { chips.innerHTML = ''; photoBtn.disabled = true; return; }
  const bins = binsFor(familyId);
  const chipHtml = bins.map(b => `<button type="button" class="bin-chip ${b.id === selectedBinId ? 'active' : ''}" data-bin="${b.id}">B${b.bin_number}</button>`).join('');
  const canAdd = bins.length < 5;
  const addHtml = `<button type="button" class="bin-chip add ${canAdd ? '' : 'disabled'}" id="addBinChip" ${canAdd ? '' : 'disabled'}>+ New bin</button>`;
  chips.innerHTML = chipHtml + addHtml;
  chips.querySelectorAll('.bin-chip[data-bin]').forEach(el => {
    el.addEventListener('click', () => { selectedBinId = parseInt(el.dataset.bin, 10); renderBinChips(); });
  });
  const addBtn = document.getElementById('addBinChip');
  if (addBtn && canAdd) addBtn.addEventListener('click', () => createBin(familyId));
  photoBtn.disabled = !selectedBinId || !bins.some(b => b.id === selectedBinId);
  if (!bins.some(b => b.id === selectedBinId)) selectedBinId = null;
  hint.textContent = bins.length >= 5 ? 'Maximum of 5 bins reached for this box.' : '';
}

async function createBin(familyId) {
  const family = boxCache.find(b => b.id === familyId);
  if (!family) return;
  const existing = binsFor(familyId);
  if (existing.length >= 5) return;
  const nextNum = (existing.reduce((max, b) => Math.max(max, b.bin_number || 0), 0)) + 1;
  const { data, error } = await sb.from('boxes').insert({
    name: `${family.name} — B${nextNum}`,
    color_hex: family.color_hex,
    color_hex2: family.color_hex2 || null,
    parent_box_id: family.id,
    bin_number: nextNum,
    manual_only: true,
    is_fallback: false
  }).select();
  if (error || !data || !data[0]) { alert('Could not create bin.'); return; }
  await loadBoxes();
  document.getElementById('familyPicker').value = String(familyId);
  selectedBinId = data[0].id;
  renderBinChips();
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function fallbackBoxName() {
  const b = boxCache.find(b => b.is_fallback) || boxCache.find(b => /misc/i.test(b.name || ''));
  return b ? b.name : (boxCache[boxCache.length - 1]?.name || 'General');
}

function boxDot(box) {
  if (!box) return '';
  const c1 = box.color_hex || '#999';
  const bg = box.color_hex2 ? `linear-gradient(135deg, ${c1} 0 50%, ${box.color_hex2} 50% 100%)` : c1;
  return `<span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${bg};border:1px solid rgba(0,0,0,.25);vertical-align:middle;margin-right:6px;"></span>`;
}

function fallbackBoxId() {
  const b = boxCache.find(b => b.is_fallback) || boxCache.find(b => /misc/i.test(b.name || '') && !b.manual_only) || boxCache.find(b => /misc/i.test(b.name || ''));
  return b ? b.id : (boxCache[boxCache.length - 1]?.id ?? null);
}

let cameraStream = null;
let cameraFacing = 'environment';

async function openCamera() {
  // Bypasses the OS camera-picker intent entirely (some devices/OS versions
  // ignore the file input's capture="environment" hint and default to the
  // front lens) by requesting the rear camera directly via getUserMedia.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('fileInput').click();
    return;
  }
  cameraFacing = 'environment';
  const ok = await startStream(cameraFacing);
  if (!ok) {
    // getUserMedia unsupported/blocked — fall back to the native file picker
    document.getElementById('fileInput').click();
  }
}

async function startStream(facing) {
  stopStream();
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: facing } },
      audio: false
    });
  } catch (err) {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false
      });
    } catch (err2) {
      return false;
    }
  }
  const video = document.getElementById('cameraVideo');
  video.srcObject = cameraStream;
  document.getElementById('cameraOverlay').classList.add('show');
  return true;
}

function stopStream() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

function closeCamera() {
  stopStream();
  document.getElementById('cameraOverlay').classList.remove('show');
}

async function switchCamera() {
  cameraFacing = cameraFacing === 'environment' ? 'user' : 'environment';
  await startStream(cameraFacing);
}

function captureFromCamera() {
  const video = document.getElementById('cameraVideo');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    if (!blob) return;
    closeCamera();
    const file = new File([blob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' });
    if (captureMode === 'batch') {
      processBatchFile(file);
    } else if (captureMode === 'lookup') {
      processLookupFile(file);
    } else {
      processCapturedFile(file);
    }
    captureMode = 'single';
  }, 'image/jpeg', 0.9);
}

function openLookupCamera() {
  captureMode = 'lookup';
  openCamera();
}

async function processLookupFile(file) {
  const searchInput = document.getElementById('searchInput');
  searchInput.value = 'Identifying…';
  try {
    const b64 = await fileToBase64(file);
    const res = await fetch('/api/sort', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: b64, mediaType: file.type || 'image/jpeg', boxes: [] })
    });
    const suggestion = await res.json();
    const term = suggestion.item || '';
    searchInput.value = term;
    showingRemoved = false;
    document.getElementById('toggleRemovedBtn').textContent = 'Removed items';
    searchItems(term);
  } catch (err) {
    searchInput.value = '';
    loadLog();
  }
  searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function openBatchCamera() {
  if (!selectedBinId) return;
  captureMode = 'batch';
  openCamera();
}

async function processBatchFile(file) {
  const bin = boxCache.find(b => b.id === selectedBinId);
  if (!bin) return;
  const batchCard = document.getElementById('batchCard');
  const batchRows = document.getElementById('batchRows');
  const targetLabel = document.getElementById('batchTargetLabel');
  targetLabel.textContent = `Sorting into: ${bin.name} — detecting items…`;
  batchRows.innerHTML = '';
  batchCard.classList.add('show');
  batchDetected = [];
  currentFile = file;

  try {
    const b64 = await fileToBase64(file);
    const res = await fetch('/api/sort-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: b64, mediaType: file.type || 'image/jpeg' })
    });
    if (!res.ok) throw new Error('batch sort failed');
    const parsed = await res.json();
    batchDetected = Array.isArray(parsed.items) ? parsed.items : [];
  } catch (err) {
    batchDetected = [];
  }
  if (!batchDetected.length) batchDetected = [{ item: '', qty: 1 }];
  targetLabel.textContent = `Sorting into: ${bin.name}`;
  renderBatchReview();
}

function renderBatchReview() {
  const batchRows = document.getElementById('batchRows');
  batchRows.innerHTML = batchDetected.map((it, i) => `
    <div class="batch-row" data-idx="${i}">
      <input type="text" value="${(it.item || '').replace(/"/g, '&quot;')}" placeholder="Item name" data-field="item">
      <input type="number" min="1" value="${it.qty || 1}" data-field="qty">
      <button class="icon-btn" data-remove="${i}" title="Remove">🗑</button>
    </div>
  `).join('') + `<button class="link-btn" id="batchAddRowBtn">+ Add item</button>`;
  batchRows.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', () => { batchDetected.splice(parseInt(el.dataset.remove, 10), 1); renderBatchReview(); });
  });
  const addRowBtn = document.getElementById('batchAddRowBtn');
  if (addRowBtn) addRowBtn.addEventListener('click', () => { batchDetected.push({ item: '', qty: 1 }); renderBatchReview(); });
}

function readBatchRows() {
  const rows = document.querySelectorAll('#batchRows .batch-row');
  return Array.from(rows).map(row => ({
    item: row.querySelector('[data-field="item"]').value.trim(),
    qty: parseInt(row.querySelector('[data-field="qty"]').value, 10) || 1
  })).filter(r => r.item);
}

async function saveBatch() {
  const bin = boxCache.find(b => b.id === selectedBinId);
  if (!bin) return;
  const rows = readBatchRows();
  if (!rows.length) { cancelBatch(); return; }

  let path = null;
  if (currentFile) {
    path = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
    await sb.storage.from('item-photos').upload(path, currentFile, { contentType: currentFile.type || 'image/jpeg' });
  }

  const { data: itemRows } = await sb.from('items').insert(
    rows.map(r => ({ name: r.item, description: null, box_id: bin.id, status: 'confirmed', qty: r.qty }))
  ).select();

  if (path && itemRows && itemRows.length) {
    await sb.from('item_photos').insert(itemRows.map(row => ({ item_id: row.id, image_path: path })));
  }

  cancelBatch();
  loadLog();
  loadStreak();
}

function cancelBatch() {
  document.getElementById('batchCard').classList.remove('show');
  batchDetected = [];
  currentFile = null;
}

async function handleCapture(e) {
  const file = e.target.files[0];
  if (!file) return;
  await processCapturedFile(file);
}

async function processCapturedFile(file) {
  currentFile = file;

  const resultCard = document.getElementById('resultCard');
  const resultPhoto = document.getElementById('resultPhoto');
  const loadingLine = document.getElementById('loadingLine');
  const resultBody = document.getElementById('resultBody');
  const dupWarning = document.getElementById('dupWarning');

  currentPhotoUrl = URL.createObjectURL(file);
  resultPhoto.src = currentPhotoUrl;
  resultCard.classList.add('show');
  loadingLine.style.display = 'block';
  loadingLine.textContent = 'Sorting…';
  resultBody.style.display = 'none';
  dupWarning.style.display = 'none';
  document.getElementById('qtyInput').value = 1;

  try {
    const b64 = await fileToBase64(file);
    const eligibleBoxes = boxCache.filter(b => !b.manual_only);
    const res = await fetch('/api/sort', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: b64,
        mediaType: file.type || 'image/jpeg',
        boxes: eligibleBoxes.map(b => ({ name: b.name, keywords: b.keywords, is_fallback: !!b.is_fallback }))
      })
    });
    if (!res.ok) throw new Error('sort failed');
    const suggestion = await res.json();
    currentSuggestion = suggestion;
    document.getElementById('itemNameInput').value = suggestion.item || '';
    const matched = eligibleBoxes.find(b => b.name === suggestion.box);
    document.getElementById('boxPicker').value = matched ? matched.id : fallbackBoxId();
    document.getElementById('reasoning').textContent = suggestion.reason || '';
    await checkDuplicate(suggestion.item);
    loadingLine.style.display = 'none';
    resultBody.style.display = 'block';
  } catch (err) {
    currentSuggestion = { box: fallbackBoxName(), reason: '' };
    document.getElementById('itemNameInput').value = '';
    document.getElementById('boxPicker').value = fallbackBoxId();
    document.getElementById('reasoning').textContent = 'Sorting failed — filed as miscellaneous, edit if needed.';
    loadingLine.style.display = 'none';
    resultBody.style.display = 'block';
  }
}

async function checkDuplicate(itemName) {
  const dupWarning = document.getElementById('dupWarning');
  if (!itemName) { dupWarning.style.display = 'none'; return; }
  const since = new Date(Date.now() - 10 * 60 * 1000).toISOString();
  const { data } = await sb.from('items')
    .select('name, created_at, box:box_id(name)')
    .ilike('name', itemName)
    .gt('created_at', since)
    .order('created_at', { ascending: false })
    .limit(1);
  if (data && data[0]) {
    const mins = Math.round((Date.now() - new Date(data[0].created_at).getTime()) / 60000);
    dupWarning.textContent = `⚠ Possible duplicate — "${data[0].name}" was logged ${mins} min ago in ${data[0].box ? data[0].box.name : 'a box'}.`;
    dupWarning.style.display = 'block';
  } else {
    dupWarning.style.display = 'none';
  }
}

function cancelCapture() {
  document.getElementById('resultCard').classList.remove('show');
  currentFile = null; currentSuggestion = null;
  document.getElementById('fileInput').value = '';
}

async function finalize(status) {
  if (!currentFile) return;
  const boxId = status === 'misc' ? fallbackBoxId() : (parseInt(document.getElementById('boxPicker').value, 10) || fallbackBoxId());
  const box = boxCache.find(b => b.id === boxId) || boxCache.find(b => b.id === fallbackBoxId());
  const itemName = document.getElementById('itemNameInput').value.trim() || currentSuggestion?.item || (box ? box.name : 'Item');
  const qty = parseInt(document.getElementById('qtyInput').value, 10) || 1;

  const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
  await sb.storage.from('item-photos').upload(path, currentFile, { contentType: currentFile.type || 'image/jpeg' });

  const { data: itemRows } = await sb.from('items').insert({
    name: itemName,
    description: currentSuggestion?.reason || null,
    box_id: box ? box.id : null,
    status: status,
    qty: qty
  }).select();

  if (itemRows && itemRows[0]) {
    await sb.from('item_photos').insert({ item_id: itemRows[0].id, image_path: path });
  }

  document.getElementById('resultCard').classList.remove('show');
  currentFile = null; currentSuggestion = null;
  document.getElementById('fileInput').value = '';
  loadLog();
  loadStreak();
}

function photoUrl(path) {
  return `${SUPABASE_URL}/storage/v1/object/public/item-photos/${path}`;
}

function renderRows(data) {
  const logList = document.getElementById('logList');
  if (!data || !data.length) { logList.innerHTML = `<div class="empty">${showingRemoved ? 'No removed items.' : 'No items found.'}</div>`; return; }
  logList.innerHTML = data.map(it => {
    const img = it.item_photos && it.item_photos[0] ? `<img src="${photoUrl(it.item_photos[0].image_path)}" alt="">` : '';
    const boxName = it.box ? it.box.name : 'Unsorted';
    const itemLabel = it.name || boxName;
    const qtyTxt = it.qty && it.qty > 1 ? ` ×${it.qty}` : '';
    const time = new Date(it.created_at).toLocaleString();
    const removedNote = it.removed_at ? `<div style="color:var(--sub);font-size:.75rem;">Removed ${new Date(it.removed_at).toLocaleString()}</div>` : '';
    const actions = it.removed_at
      ? `<button class="icon-btn" onclick="restoreItem('${it.id}')" title="Restore to bin">↺</button><button class="icon-btn" onclick="deleteItem('${it.id}')" title="Delete permanently">🗑</button>`
      : `<button class="icon-btn" onclick="startEdit('${it.id}')" title="Edit">✎</button><button class="icon-btn" onclick="removeItem('${it.id}')" title="Remove from bin (keeps history)">📤</button><button class="icon-btn" onclick="deleteItem('${it.id}')" title="Delete permanently">🗑</button>`;
    return `<div class="log-item" data-id="${it.id}">${img}<div class="meta"><div>${boxDot(it.box)}${itemLabel}${qtyTxt} <span style="color:var(--sub);font-size:.8rem;">→ ${boxName}</span></div><div class="time">${time}</div>${removedNote}</div><div class="row-actions"><span class="status-pill ${it.status}">${it.status}</span>${actions}</div></div>`;
  }).join('');
}

async function loadLog() {
  let q = sb
    .from('items')
    .select('id, name, description, status, created_at, removed_at, qty, box:box_id(id, name, color_hex, emoji), item_photos(image_path)')
    .order('created_at', { ascending: false })
    .limit(showingAll ? 500 : 15);
  q = showingRemoved ? q.not('removed_at', 'is', null) : q.is('removed_at', null);
  const { data } = await q;
  renderRows(data);
}

async function searchItems(term) {
  if (!term) { loadLog(); return; }
  let q = sb
    .from('items')
    .select('id, name, description, status, created_at, removed_at, qty, box:box_id(id, name, color_hex, emoji), item_photos(image_path)')
    .ilike('name', `%${term}%`)
    .order('created_at', { ascending: false })
    .limit(200);
  q = showingRemoved ? q.not('removed_at', 'is', null) : q.is('removed_at', null);
  const { data } = await q;
  renderRows(data);
}

async function removeItem(id) {
  await sb.from('items').update({ removed_at: new Date().toISOString() }).eq('id', id);
  loadLog();
}

async function restoreItem(id) {
  await sb.from('items').update({ removed_at: null }).eq('id', id);
  loadLog();
}

async function startEdit(id) {
  const row = document.querySelector(`.log-item[data-id="${id}"]`);
  if (!row) return;
  const { data } = await sb.from('items').select('id, name, box_id').eq('id', id).single();
  if (!data) return;
  const meta = row.querySelector('.meta');
  const boxOptions = boxCache.map(b => `<option value="${b.id}" ${b.id === data.box_id ? 'selected' : ''}>${b.emoji ? b.emoji + ' ' : ''}${b.name}</option>`).join('');
  meta.innerHTML = `<div class="edit-row">
    <input type="text" value="${(data.name || '').replace(/"/g, '&quot;')}" id="editName-${id}">
    <select id="editBox-${id}">${boxOptions}</select>
    <button class="link-btn" onclick="saveEdit('${id}')">Save</button>
    <button class="link-btn" onclick="loadLog()">Cancel</button>
  </div>`;
}

async function saveEdit(id) {
  const name = document.getElementById(`editName-${id}`).value.trim();
  const boxId = parseInt(document.getElementById(`editBox-${id}`).value, 10);
  await sb.from('items').update({ name, box_id: boxId }).eq('id', id);
  loadLog();
}

async function deleteItem(id) {
  if (!confirm('Permanently delete this item? This cannot be undone — use "remove" instead if it might come back.')) return;
  await sb.from('item_photos').delete().eq('item_id', id);
  await sb.from('items').delete().eq('id', id);
  loadLog();
  loadStreak();
}

async function loadStreak() {
  const { data } = await sb.from('items').select('created_at');
  if (!data) { document.getElementById('streakLine').textContent = ''; return; }
  const days = new Set(data.map(r => new Date(r.created_at).toDateString()));
  document.getElementById('streakLine').textContent = `${data.length} items sorted · ${days.size} active day${days.size===1?'':'s'}`;
}

function escapeHtml(v) {
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function textColorFor(hex) {
  if (!hex) return '#000000';
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.6 ? '#000000' : '#ffffff';
}

function hexToArgb(hex) {
  const h = (hex || '#f2f2f2').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  return 'FF' + full.toUpperCase();
}

async function exportCsv() {
  const { data } = await sb
    .from('items')
    .select('name, description, status, created_at, qty, box:box_id(name, color_hex)')
    .order('created_at', { ascending: false })
    .limit(2000);
  if (!data || !data.length) return;

  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet('Housemaster');

  // Box first, then Item — matches how the boxes are actually used to find things.
  sheet.columns = [
    { header: 'Box', key: 'box', width: 24 },
    { header: 'Item', key: 'item', width: 32 },
    { header: 'Qty', key: 'qty', width: 8 },
    { header: 'Status', key: 'status', width: 14 },
    { header: 'Description', key: 'description', width: 48 },
    { header: 'Date', key: 'date', width: 22 }
  ];

  const headerRow = sheet.getRow(1);
  headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
  headerRow.eachCell(cell => {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF333333' } };
    cell.alignment = { vertical: 'middle' };
  });
  sheet.views = [{ state: 'frozen', ySplit: 1 }];

  data.forEach(it => {
    const bgHex = it.box && it.box.color_hex ? it.box.color_hex : '#f2f2f2';
    const fgHex = textColorFor(bgHex);
    const row = sheet.addRow({
      box: it.box ? it.box.name : '',
      item: it.name || '',
      qty: it.qty || 1,
      status: it.status || '',
      description: it.description || '',
      date: new Date(it.created_at).toLocaleString()
    });
    row.eachCell(cell => {
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: hexToArgb(bgHex) } };
      cell.font = { color: { argb: hexToArgb(fgHex) } };
      cell.alignment = { vertical: 'top', wrapText: true };
    });
  });

  const buf = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `housemaster_export_${Date.now()}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('fileInput').addEventListener('change', handleCapture);
document.getElementById('snapBtn').addEventListener('click', openCamera);
document.getElementById('camCancelBtn').addEventListener('click', closeCamera);
document.getElementById('camShutterBtn').addEventListener('click', captureFromCamera);
document.getElementById('camSwitchBtn').addEventListener('click', switchCamera);
document.getElementById('splitToggleBtn').addEventListener('click', () => {
  const panel = document.getElementById('splitPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('familyPicker').addEventListener('change', () => { selectedBinId = null; renderBinChips(); });
document.getElementById('binPhotoBtn').addEventListener('click', openBatchCamera);
document.getElementById('batchSaveBtn').addEventListener('click', saveBatch);
document.getElementById('batchCancelBtn').addEventListener('click', cancelBatch);
document.getElementById('confirmBtn').addEventListener('click', () => finalize('confirmed'));
document.getElementById('miscBtn').addEventListener('click', () => finalize('misc'));
document.getElementById('laterBtn').addEventListener('click', () => finalize('later'));
document.getElementById('cancelBtn').addEventListener('click', cancelCapture);
document.getElementById('exportBtn').addEventListener('click', exportCsv);
document.getElementById('toggleRemovedBtn').addEventListener('click', () => {
  showingRemoved = !showingRemoved;
  document.getElementById('toggleRemovedBtn').textContent = showingRemoved ? 'Back to active' : 'Removed items';
  document.getElementById('logTitle').firstChild.textContent = showingRemoved ? 'Removed ' : 'Recent';
  document.getElementById('searchInput').value = '';
  loadLog();
});
document.getElementById('lookupPhotoBtn').addEventListener('click', openLookupCamera);
document.getElementById('toggleAllBtn').addEventListener('click', () => {
  showingAll = !showingAll;
  document.getElementById('toggleAllBtn').textContent = showingAll ? 'Show recent' : 'Show all';
  document.getElementById('searchInput').value = '';
  loadLog();
});
let searchDebounce;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const term = e.target.value.trim();
  searchDebounce = setTimeout(() => searchItems(term), 300);
});

loadBoxes().then(() => { loadLog(); loadStreak(); });
</script>
