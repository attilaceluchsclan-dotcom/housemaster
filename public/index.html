<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housemaster — Snap & Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:#f3f2f6; --card:#ffffff; --ink:#1c1a22; --sub:#5d5968; --line:#d9d5e2;
    --accent:#553a86; --accent-ink:#ffffff; --accent-soft:#e7e0f3;
    --good:#2e7d32; --later:#6b6478; --warn:#b26a00; --danger:#b3261e;
    --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
    --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme:dark; --bg:#15131a; --card:#1f1c26; --ink:#ece9f2; --sub:#a7a1b4; --line:#37323f;
      --accent:#b59be4; --accent-ink:#1a1422; --accent-soft:#2e2640; --later:#4a4456; --warn:#f0b35a; --danger:#f2b8b5; }
  }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); min-height:100vh; padding:20px 16px 60px; }
  .wrap { max-width:480px; margin:0 auto; }
  h1 { font:700 1.9rem/1 var(--display); letter-spacing:.01em; margin:0 0 8px; }
  h1 .hl { color:var(--accent); }
  .streak { color:var(--sub); font:500 .8rem var(--mono); margin-bottom:16px; font-variant-numeric:tabular-nums; }
  .capture-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; text-align:center; margin-bottom:20px; }
  .snap-btn { display:inline-flex; align-items:center; justify-content:center; width:88px; height:88px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:2rem; cursor:pointer; user-select:none; border:none; }
  .snap-btn:active { transform:scale(.96); }
  #fileInput { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
  .camera-overlay { position:fixed; inset:0; background:#000; display:none; z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
  .camera-overlay.show { display:flex; }
  .camera-overlay video { width:100%; height:100%; object-fit:cover; }
  .camera-controls { position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:40px; padding:24px 20px calc(24px + env(safe-area-inset-bottom, 0px)); background:linear-gradient(transparent, rgba(0,0,0,.6)); }
  .cam-shutter { width:72px; height:72px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,.5); cursor:pointer; }
  .cam-shutter:active { transform:scale(.94); }
  .cam-cancel, .cam-switch { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .hint { color:var(--sub); font-size:.85rem; margin-top:10px; }
  .result-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:20px; display:none; }
  .result-card.show { display:block; }
  .result-photo { width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:12px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:.75rem; color:var(--sub); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
  .field input[type="text"], .field select, .field input[type="number"] {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:.95rem;
  }
  .row2 { display:flex; gap:10px; }
  .row2 .field { flex:1; }
  .reasoning { color:var(--sub); font-size:.85rem; margin-bottom:14px; }
  .dup-warning { background:rgba(181,101,29,.12); color:var(--warn); border:1px solid rgba(181,101,29,.3); border-radius:10px; padding:8px 10px; font-size:.82rem; margin-bottom:12px; }
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .action-btn { padding:12px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:.9rem; cursor:pointer; width:100%; }
  .action-btn.confirm { background:var(--good); color:#fff; border-color:var(--good); }
  .action-btn.misc { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .action-btn.later { background:var(--later); color:#fff; border-color:var(--later); }
  .action-btn.cancel { background:transparent; color:var(--danger); border-color:var(--danger); }
  .loading { color:var(--sub); font-size:.9rem; padding:10px 0; }
  .log h2 { font:700 1.3rem var(--display); letter-spacing:.04em; text-transform:uppercase; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; row-gap:6px; }
  .log h2 .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .link-btn { background:none; border:none; color:var(--accent); font-size:.78rem; cursor:pointer; padding:2px 4px; white-space:nowrap; }
  .search-box { width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:.85rem; margin-bottom:12px; }
  .log-item { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .log-item img { width:44px; height:44px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .log-item .meta { flex:1 1 160px; min-width:0; overflow-wrap:anywhere; }
  .log-item .time { color:var(--sub); font-size:.75rem; }
  .log-item .row-actions { display:flex; gap:6px; align-items:center; flex-shrink:0; margin-left:auto; }
  .icon-btn { background:none; border:none; cursor:pointer; font-size:.9rem; padding:4px; color:var(--sub); }
  .status-pill { font-size:.7rem; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .status-pill.confirmed { background:rgba(58,125,68,.15); color:var(--good); }
  .status-pill.misc { background:rgba(181,101,29,.15); color:var(--accent); }
  .status-pill.later { background:rgba(107,104,98,.15); color:var(--later); }
  .empty { color:var(--sub); font-size:.85rem; text-align:center; padding:20px 0; }
  .edit-row { display:flex; gap:6px; flex-wrap:wrap; flex:1 1 100%; align-items:center; }
  .edit-row input, .edit-row select { padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:.82rem; max-width:100%; }
  .edit-row input[type="text"] { flex:1 1 140px; min-width:0; }
  .split-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 20px; margin-bottom:20px; }
  .split-card select { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .bin-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .bin-chip { padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:.85rem; cursor:pointer; }
  .bin-chip.active { outline:2px solid var(--accent); font-weight:600; }
  .bin-chip.add { border-style:dashed; color:var(--sub); }
  .bin-chip.disabled { opacity:.4; cursor:not-allowed; }
  .batch-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:20px; display:none; }
  .batch-card.show { display:block; }
  .batch-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .batch-row input[type="text"] { flex:1 1 auto; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .batch-row input[type="number"] { width:56px; padding:8px 6px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .search-row { display:flex; gap:8px; align-items:center; }
  .search-row .search-box { flex:1 1 auto; }
  .search-row .link-btn { flex-shrink:0; white-space:nowrap; }
  .bins-card { margin-bottom:20px; }
  .bins-card h2, .sec-h { font:700 1.3rem var(--display); letter-spacing:.04em; text-transform:uppercase; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline; }
  .sec-h small, .bins-card h2 small { font:500 .75rem var(--mono); color:var(--sub); letter-spacing:0; text-transform:none; }
  .bin-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .bin-tile { display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:center; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 10px; color:var(--ink); cursor:pointer; font:inherit; min-width:0; transition:background .3s, box-shadow .3s; }
  .bin-tile[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--accent-soft); }
  .bin-tile .sw { width:18px; height:18px; border-radius:4px; border:1px solid rgba(0,0,0,.25); }
  .bin-tile .nm { font:600 .98rem/1.05 var(--display); letter-spacing:.02em; text-transform:uppercase; overflow-wrap:anywhere; }
  .bin-tile .cd { font:400 .68rem var(--mono); color:var(--sub); }
  .bin-tile .ct { font:500 .95rem var(--mono); font-variant-numeric:tabular-nums; }
  .bin-tile.flash { animation:flash 1.8s ease-out; }
  @keyframes flash { 0%,30% { background:var(--accent); color:var(--accent-ink); transform:scale(1.04); } 100% { transform:none; } }
  @media (prefers-reduced-motion: reduce) { .bin-tile.flash { animation:none; outline:3px solid var(--accent); } }
  .cat-badge { display:none; align-items:center; gap:10px; border-radius:10px; padding:10px 12px; margin-bottom:12px; font:700 1.25rem/1.1 var(--display); letter-spacing:.03em; text-transform:uppercase; }
  .cat-badge.show { display:flex; }
  .cat-badge .code { font:500 .8rem var(--mono); opacity:.85; margin-left:auto; }
  .toast-old { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:10px; font-weight:600; z-index:2000; max-width:calc(100% - 32px); display:none; }

  body { padding-bottom:210px; font-size:16px; }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .brand { font:700 1.15rem var(--display); letter-spacing:.12em; }
  #householdPicker { padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:700 .95rem var(--display); letter-spacing:.06em; text-transform:uppercase; }
  .rapid { margin-left:auto; border:1px solid var(--line); background:var(--card); color:var(--sub); border-radius:99px; padding:6px 12px; font:700 .85rem var(--mono); cursor:pointer; }
  .rapid[aria-pressed="true"] { background:#2ee6a6; color:#062a1d; border-color:#2ee6a6; }
  .sec-h { font:700 1.6rem var(--display); letter-spacing:.06em; margin:4px 0 10px; display:flex; justify-content:space-between; align-items:baseline; }
  .sec-h small { font:500 .75rem var(--mono); color:var(--sub); letter-spacing:0; text-transform:none; }
  .storage { margin-bottom:18px; }
  .storage .split-card { margin:10px 0 0; padding:10px 14px; }
  .bin-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .bin-tile { display:flex; flex-direction:column; align-items:stretch; text-align:left; border:none; border-radius:10px; padding:7px 7px 8px; cursor:pointer; min-height:74px; position:relative; font:inherit; }
  .bin-tile .cd { font:800 1.25rem/1 var(--display); letter-spacing:.03em; }
  .bin-tile .cd, .bin-tile .ct, .bin-tile .nm { color:inherit; }
  .bin-tile .ct { position:absolute; top:6px; right:7px; font:700 .9rem var(--mono); }
  .bin-tile .nm { font:600 .62rem/1.15 var(--body); margin-top:3px; opacity:.92; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .bin-tile .bar { margin-top:auto; height:4px; border-radius:2px; background:rgba(0,0,0,.28); }
  .bin-tile .bar i { display:block; height:100%; border-radius:2px; background:currentColor; }
  body.searching .storage { display:none; }
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:900; background:var(--bg); border-top:1px solid var(--line); padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)); box-shadow:0 -8px 24px rgba(0,0,0,.25); }
  .dock > * { max-width:480px; margin-left:auto; margin-right:auto; }
  .find-lbl { font:700 1.15rem var(--display); letter-spacing:.06em; margin-bottom:6px; }
  .find-row { display:flex; gap:8px; }
  .find-input { flex:1; position:relative; display:flex; align-items:center; min-width:0; }
  .find-input svg { position:absolute; left:12px; width:22px; height:22px; color:#777; pointer-events:none; }
  .find-input input { width:100%; height:54px; padding:0 40px 0 42px; border-radius:14px; border:none; background:#fff; color:#111; font:500 1.1rem var(--body); -webkit-appearance:none; appearance:none; }
  .find-input input::-webkit-search-cancel-button { display:none; }
  .find-input input:focus { outline:3px solid var(--accent); }
  .clear-btn { position:absolute; right:8px; width:30px; height:30px; border:none; border-radius:50%; background:#e6e3ea; color:#111; display:none; cursor:pointer; }
  body.searching .clear-btn { display:block; }
  .sq { width:54px; height:54px; flex:none; border:none; border-radius:14px; background:var(--card); color:var(--ink); font-size:1.4rem; cursor:pointer; display:grid; place-items:center; border:1px solid var(--line); }
  .sq.mic { background:#ffc53d; color:#1b1400; border-color:#ffc53d; }
  .sort-btn { display:block; width:100%; margin-top:10px; height:64px; border:none; border-radius:16px; background:#7c4dff; color:#fff; font:700 1.7rem var(--display); letter-spacing:.05em; cursor:pointer; }
  .sort-btn:active { transform:scale(.98); }
  .snap-btn { display:none; }
  .countdown { display:flex; align-items:center; gap:12px; background:#2ee6a6; color:#062a1d; border-radius:12px; padding:8px 12px; margin-bottom:12px; font-weight:600; }
  .countdown[hidden] { display:none; }
  .countdown .ring { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(#062a1d var(--p,100%), rgba(6,42,29,.2) 0); flex:none; }
  .countdown .ring b { width:34px; height:34px; border-radius:50%; background:#2ee6a6; display:grid; place-items:center; font:700 1.1rem var(--mono); }
  .voice { position:fixed; inset:0; z-index:1500; background:rgba(12,10,16,.96); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  .voice[hidden] { display:none; }
  .voice .orb { width:170px; height:170px; border-radius:50%; display:grid; place-items:center; color:#1b1400; background:radial-gradient(circle,#ffc53d 0 45%,rgba(255,197,61,.25) 46% 70%,rgba(255,197,61,.08) 71%); animation:pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform:scale(1.08); } }
  .v-h { font:700 2.4rem var(--display); letter-spacing:.05em; }
  .v-said { font-size:1.3rem; font-weight:600; max-width:22ch; }
  .v-stop { margin-top:10px; border:1px solid #555; background:none; color:#fff; border-radius:99px; padding:10px 22px; font-weight:600; }
  .boxpage { position:fixed; inset:0; z-index:1200; background:var(--bg); overflow-y:auto; padding-bottom:40px; }
  .boxpage[hidden] { display:none; }
  .bp-head { padding:16px 16px 18px; }
  .bp-back { border:none; background:rgba(0,0,0,.25); color:inherit; border-radius:99px; padding:8px 14px; font-weight:700; cursor:pointer; }
  .bp-code { font:800 4rem/.9 var(--display); margin-top:14px; }
  .bp-name { font:700 1.35rem var(--body); }
  .bp-stats { font:500 .85rem var(--mono); margin-top:8px; opacity:.9; }
  .bp-full { margin-top:10px; height:10px; border-radius:5px; background:rgba(0,0,0,.28); }
  .bp-full i { display:block; height:100%; border-radius:5px; background:currentColor; }
  .bp-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:14px 16px; max-width:520px; margin:0 auto; }
  .bp-item { position:relative; height:160px; border-radius:14px; overflow:hidden; background:var(--card) center/cover; border:1px solid var(--line); }
  .bp-item span { position:absolute; left:0; right:0; bottom:0; padding:22px 8px 7px; font-size:.8rem; font-weight:600; color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.85)); }
  .bp-item .q { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.6); color:#fff; font:700 .75rem var(--mono); padding:2px 6px; border-radius:6px; }
  .bp-empty { color:var(--sub); padding:30px 16px; text-align:center; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(200px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 12px 10px 16px; border-radius:12px; font-weight:600; z-index:2000; max-width:calc(100% - 32px); display:none; align-items:center; gap:12px; }
  .toast.show { display:flex; }
  #undoBtn { border:none; background:#ffc53d; color:#1b1400; font:700 .85rem var(--mono); border-radius:8px; padding:6px 10px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">HOUSEMASTER</span>
    <select id="householdPicker" aria-label="Household"><option value="1">Household 1</option><option value="2">Household 2</option></select>
    <button type="button" id="rapidBtn" class="rapid" aria-pressed="false" title="Rapid mode: saves by itself after 3 seconds">⚡ Rapid</button>
  </header>
  <div class="streak" id="streakLine">Loading…</div>
  <span id="hhTitle" hidden></span>
  <div class="result-card" id="resultCard">
    <img class="result-photo" id="resultPhoto" alt="captured item">
    <div id="loadingLine" class="loading" style="display:none;">Sorting…</div>
    <div id="countdown" class="countdown" hidden><span class="ring"><b id="cdNum">3</b></span><span>Saving by itself… tap anything to stop</span></div>
    <div id="resultBody" style="display:none;">
      <div id="catBadge" class="cat-badge"></div>
      <div id="dupWarning" class="dup-warning" style="display:none;"></div>
      <div class="field">
        <label for="itemNameInput">Item name</label>
        <input type="text" id="itemNameInput" placeholder="Item name">
      </div>
      <div class="row2">
        <div class="field">
          <label for="boxPicker">Box</label>
          <select id="boxPicker"></select>
        </div>
        <div class="field" style="max-width:90px;">
          <label for="qtyInput">Qty</label>
          <input type="number" id="qtyInput" min="1" value="1">
        </div>
      </div>
      <div class="reasoning" id="reasoning"></div>
      <div class="btn-row">
        <button class="action-btn confirm" id="confirmBtn">✓ Confirm</button>
        <button class="action-btn misc" id="miscBtn">General</button>
        <button class="action-btn later" id="laterBtn">Check later</button>
        <button class="action-btn cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>
  <div class="batch-card" id="batchCard">
    <div class="hint" id="batchTargetLabel" style="margin-bottom:10px;"></div>
    <div id="batchRows"></div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="action-btn confirm" id="batchSaveBtn">✓ Save all to this bin</button>
      <button class="action-btn cancel" id="batchCancelBtn">Cancel</button>
    </div>
  </div>


  <div class="camera-overlay" id="cameraOverlay">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="camera-controls">
      <button class="cam-cancel" id="camCancelBtn" type="button" aria-label="Cancel">✕</button>
      <button class="cam-shutter" id="camShutterBtn" type="button" aria-label="Take photo"></button>
      <button class="cam-switch" id="camSwitchBtn" type="button" aria-label="Switch camera">⟲</button>
    </div>
  </div>




  <section class="storage" id="storageSec">
    <h2 class="sec-h">STORAGE <small>tap a box to open it</small></h2>
    <div class="bin-grid" id="binGrid"></div>
  <div class="split-card">
    <button class="link-btn" id="splitToggleBtn">🗂 Split a box into sections</button>
    <div id="splitPanel" style="display:none;margin-top:10px;">
      <div class="field">
        <label for="familyPicker">Box to split</label>
        <select id="familyPicker"></select>
      </div>
      <div class="field">
        <label>Sections in this box (up to 5)</label>
        <div class="bin-chips" id="binChips"></div>
      </div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="action-btn confirm" id="binPhotoBtn" disabled>📷 Photo this section's items</button>
      </div>
      <div class="hint" id="binHint" style="margin-top:6px;"></div>
    </div>
  </div>
  </section>

  <div class="log">
    <h2 id="logTitle">Recent
      <span class="actions">
        <button class="link-btn" id="toggleAllBtn">Show all</button>
        <button class="link-btn" id="toggleRemovedBtn">Removed items</button>
        <button class="link-btn" id="exportBtn">Export (color)</button>
      </span>
    </h2>
    <div id="logList"><div class="empty">No items sorted yet.</div></div>
  </div>
</div>
<div class="dock" id="dock">
  <div class="find-lbl">FIND THE ITEM</div>
  <div class="find-row">
    <div class="find-input">

let cameraStream = null;
let cameraFacing = 'environment';

async function openCamera() {
  // Bypasses the OS camera-picker intent entirely (some devices/OS versions
  // ignore the file input's capture="environment" hint and default to the
  // front lens) by requesting the rear camera directly via getUserMedia.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('fileInput').click();
    return;
  }
  cameraFacing = 'environment';
  const ok = await startStream(cameraFacing);
  if (!ok) {
    // getUserMedia unsupported/blocked — fall back to the native file picker
    document.getElementById('fileInput').click();
  }
}

async function startStream(facing) {
  stopStream();
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: facing } },
      audio: false
    });
  } catch (err) {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing },
        audio: false
      });
    } catch (err2) {
      return false;
    }
  }
  const video = document.getElementById('cameraVideo');
  video.srcObject = cameraStream;
  document.getElementById('cameraOverlay').classList.add('show');
  return true;
}

function stopStream() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

function closeCamera() {
  stopStream();
  document.getElementById('cameraOverlay').classList.remove('show');
}

async function switchCamera() {
  cameraFacing = cameraFacing === 'environment' ? 'user' : 'environment';
  await startStream(cameraFacing);
}

function captureFromCamera() {
  const video = document.getElementById('cameraVideo');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    if (!blob) return;
    closeCamera();
    const file = new File([blob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' });
    if (captureMode === 'batch') {
      processBatchFile(file);
    } else if (captureMode === 'lookup') {
      processLookupFile(file);
    } else {
      processCapturedFile(file);
    }
    captureMode = 'single';
  }, 'image/jpeg', 0.9);
}

async function processBatchFile(file) {

    const b64 = await fileToBase64(file);

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: b64, mediaType: file.type || 'image/jpeg' })
    });

    batchDetected = Array.isArray(parsed.items) ? parsed.items : [];

    </div>
  `).join('') + `<button class="link-btn" id="batchAddRowBtn">+ Add item</button>`;
  batchRows.querySelectorAll('[data-remove]').forEach(el => {
    el.addEventListener('click', () => { batchDetected.splice(parseInt(el.dataset.remove, 10), 1); renderBatchReview(); });
  });
  const addRowBtn = document.getElementById('batchAddRowBtn');
  if (addRowBtn) addRowBtn.addEventListener('click', () => { batchDetected.push({ item: '', qty: 1 }); renderBatchReview(); });
}

async function saveBatch() {

  let path = null;
  if (currentFile) {
    path = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
    await sb.storage.from('item-photos').upload(path, currentFile, { contentType: currentFile.type || 'image/jpeg' });
  }

  const { data: itemRows } = await sb.from('items').insert(
    rows.map(r => ({ name: r.item, description: null, box_id: bin.id, status: 'confirmed', qty: r.qty, household_id: HH }))
  ).select();

  if (path && itemRows && itemRows.length) {
    await sb.from('item_photos').insert(itemRows.map(row => ({ item_id: row.id, image_path: path })));
  }
  if (itemRows && itemRows.length) lastSaved = { ids: itemRows.map(r => r.id), path };
  ding();

  cancelBatch();
  toast(`Saved ${rows.length} item${rows.length === 1 ? '' : 's'} to ${bin.name}`, !!lastSaved);
  loadLog();
  await loadStreak();
  flashBin(bin.id);

  currentFile = null;
}

async function handleCapture(e) {
  const file = e.target.files[0];
  if (!file) return;
  await processCapturedFile(file);
}

async function processCapturedFile(file) {
  currentFile = file;

  const resultCard = document.getElementById('resultCard');
  const resultPhoto = document.getElementById('resultPhoto');
  const loadingLine = document.getElementById('loadingLine');
  const resultBody = document.getElementById('resultBody');
  const dupWarning = document.getElementById('dupWarning');

  currentPhotoUrl = URL.createObjectURL(file);
  resultPhoto.src = currentPhotoUrl;
  resultCard.classList.add('show');
  loadingLine.style.display = 'block';
  loadingLine.textContent = 'Sorting…';
  resultBody.style.display = 'none';
  dupWarning.style.display = 'none';
  document.getElementById('catBadge').classList.remove('show');
  document.getElementById('qtyInput').value = 1;

  try {
    const b64 = await fileToBase64(file);
    const eligibleBoxes = boxCache.filter(b => !b.manual_only);
    const res = await fetch('/api/sort', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: b64,
        mediaType: file.type || 'image/jpeg',
        boxes: eligibleBoxes.map(b => ({ name: b.name, keywords: b.keywords, is_fallback: !!b.is_fallback }))
      })
    });
    if (!res.ok) throw new Error('sort failed');
    const suggestion = await res.json();
    currentSuggestion = suggestion;
    document.getElementById('itemNameInput').value = suggestion.item || '';
    const matched = eligibleBoxes.find(b => b.name === suggestion.box);
    document.getElementById('boxPicker').value = matched ? matched.id : fallbackBoxId();
    document.getElementById('reasoning').textContent = suggestion.reason || '';
    updateBadge();
    await checkDuplicate(suggestion.item);
    loadingLine.style.display = 'none';
    resultBody.style.display = 'block';
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (rapid && document.getElementById('dupWarning').style.display === 'none') startCountdown();
  } catch (err) {
    currentSuggestion = { box: fallbackBoxName(), reason: '' };
    document.getElementById('itemNameInput').value = '';
    document.getElementById('boxPicker').value = fallbackBoxId();
    document.getElementById('reasoning').textContent = 'Sorting failed — filed as miscellaneous, edit if needed.';
    updateBadge();
    loadingLine.style.display = 'none';
    resultBody.style.display = 'block';
  }
}

async function checkDuplicate(itemName) {
  const dupWarning = document.getElementById('dupWarning');
  if (!itemName) { dupWarning.style.display = 'none'; return; }
  const since = new Date(Date.now() - 10 * 60 * 1000).toISOString();
  const { data } = await sb.from('items')
    .select('name, created_at, box:box_id(name)')
    .ilike('name', itemName)
    .eq('household_id', HH)
    .gt('created_at', since)
    .order('created_at', { ascending: false })
    .limit(1);
  if (data && data[0]) {
    const mins = Math.round((Date.now() - new Date(data[0].created_at).getTime()) / 60000);
    dupWarning.textContent = `⚠ Possible duplicate — "${data[0].name}" was logged ${mins} min ago in ${data[0].box ? data[0].box.name : 'a box'}.`;
    dupWarning.style.display = 'block';
  } else {
    dupWarning.style.display = 'none';
  }
}

function cancelCapture() {
  cancelCountdown();
  document.getElementById('resultCard').classList.remove('show');
  currentFile = null; currentSuggestion = null;
  document.getElementById('fileInput').value = '';
}

async function finalize(status) {
  if (!currentFile) return;
  const boxId = status === 'misc' ? fallbackBoxId() : (parseInt(document.getElementById('boxPicker').value, 10) || fallbackBoxId());
  const box = boxCache.find(b => b.id === boxId) || boxCache.find(b => b.id === fallbackBoxId());
  const itemName = document.getElementById('itemNameInput').value.trim() || currentSuggestion?.item || (box ? box.name : 'Item');
  const qty = parseInt(document.getElementById('qtyInput').value, 10) || 1;

  const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
  await sb.storage.from('item-photos').upload(path, currentFile, { contentType: currentFile.type || 'image/jpeg' });

  const { data: itemRows } = await sb.from('items').insert({
    name: itemName,
    description: currentSuggestion?.reason || null,
    box_id: box ? box.id : null,
    status: status,
    qty: qty,
    household_id: HH
  }).select();

  if (itemRows && itemRows[0]) {
    await sb.from('item_photos').insert({ item_id: itemRows[0].id, image_path: path });
    lastSaved = { ids: [itemRows[0].id], path };
  }
  cancelCountdown();
  ding();

  document.getElementById('resultCard').classList.remove('show');
  currentFile = null; currentSuggestion = null;
  document.getElementById('fileInput').value = '';
  if (box) toast(`Saved to ${box.name}${status === 'later' ? ' (check later)' : ''}`, !!lastSaved);
  loadLog();
  await loadStreak();
  if (box) flashBin(box.id);
  if (rapid && status === 'confirmed') setTimeout(() => openCamera(), 700);
}

function photoUrl(path) {
  return `${SUPABASE_URL}/storage/v1/object/public/item-photos/${path}`;
}

function renderRows(data) {
  const logList = document.getElementById('logList');
  if (!data || !data.length) { logList.innerHTML = `<div class="empty">${showingRemoved ? 'No removed items.' : 'No items found.'}</div>`; return; }
  logList.innerHTML = data.map(it => {
    const img = it.item_photos && it.item_photos[0] ? `<img src="${photoUrl(it.item_photos[0].image_path)}" alt="">` : '';
    const boxName = it.box ? it.box.name : 'Unsorted';
    const itemLabel = it.name || boxName;
    const qtyTxt = it.qty && it.qty > 1 ? ` ×${it.qty}` : '';
    const time = new Date(it.created_at).toLocaleString();
    const removedNote = it.removed_at ? `<div style="color:var(--sub);font-size:.75rem;">Removed ${new Date(it.removed_at).toLocaleString()}</div>` : '';
    const actions = it.removed_at
      ? `<button class="icon-btn" onclick="restoreItem('${it.id}')" title="Restore to bin">↺</button><button class="icon-btn" onclick="deleteItem('${it.id}')" title="Delete permanently">🗑</button>`
      : `<button class="icon-btn" onclick="startEdit('${it.id}')" title="Edit">✎</button><button class="icon-btn" onclick="removeItem('${it.id}')" title="Remove from bin (keeps history)">📤</button><button class="icon-btn" onclick="deleteItem('${it.id}')" title="Delete permanently">🗑</button>`;
    return `<div class="log-item" data-id="${it.id}">${img}<div class="meta"><div>${boxDot(it.box)}${itemLabel}${qtyTxt} <span style="color:var(--sub);font-size:.8rem;">→ ${boxName}</span></div><div class="time">${time}</div>${removedNote}</div><div class="row-actions"><span class="status-pill ${it.status}">${it.status}</span>${actions}</div></div>`;
  }).join('');
}

async function loadLog() {
  let q = sb
    .from('items')
    .select('id, name, description, status, created_at, removed_at, qty, box:box_id(id, name, color_hex, emoji), item_photos(image_path)')
    .eq('household_id', HH)
    .order('created_at', { ascending: false })
    .limit(filterBoxId ? 500 : (showingAll ? 500 : 15));
  if (filterBoxId) q = q.in('box_id', [filterBoxId, ...binsFor(filterBoxId).map(b => b.id)]);
  q = showingRemoved ? q.not('removed_at', 'is', null) : q.is('removed_at', null);
  const { data } = await q;
  const fb = filterBoxId && boxCache.find(b => b.id === filterBoxId);
  document.getElementById('logTitle').firstChild.textContent = showingRemoved ? 'Removed ' : (fb ? fb.name + ' ' : 'Recent');
  renderRows(data);
}

async function searchItems(term) {
  if (!term) { loadLog(); return; }
  let q = sb
    .from('items')
    .select('id, name, description, status, created_at, removed_at, qty, box:box_id(id, name, color_hex, emoji), item_photos(image_path)')
    .or(`name.ilike.%${term.replace(/[,()%*]/g, ' ').trim()}%,description.ilike.%${term.replace(/[,()%*]/g, ' ').trim()}%`)
    .eq('household_id', HH)
    .order('created_at', { ascending: false })
    .limit(200);
  q = showingRemoved ? q.not('removed_at', 'is', null) : q.is('removed_at', null);
  const { data } = await q;
  document.getElementById('logTitle').firstChild.textContent = `Results (${data ? data.length : 0}) `;
  renderRows(data);
}

function setSearching(term) {
  document.body.classList.toggle('searching', !!term);
}

async function removeItem(id) {
  await sb.from('items').update({ removed_at: new Date().toISOString() }).eq('id', id);
  loadLog(); loadCounts();
}

async function restoreItem(id) {
  await sb.from('items').update({ removed_at: null }).eq('id', id);
  loadLog(); loadCounts();
}

async function startEdit(id) {
  const row = document.querySelector(`.log-item[data-id="${id}"]`);
  if (!row) return;
  const { data } = await sb.from('items').select('id, name, box_id').eq('id', id).single();
  if (!data) return;
  const meta = row.querySelector('.meta');
  const boxOptions = boxCache.map(b => `<option value="${b.id}" ${b.id === data.box_id ? 'selected' : ''}>${b.emoji ? b.emoji + ' ' : ''}${b.name}</option>`).join('');
  meta.innerHTML = `<div class="edit-row">
    <input type="text" value="${(data.name || '').replace(/"/g, '&quot;')}" id="editName-${id}">
    <select id="editBox-${id}">${boxOptions}</select>
    <button class="link-btn" onclick="saveEdit('${id}')">Save</button>
    <button class="link-btn" onclick="loadLog()">Cancel</button>
  </div>`;
}

async function saveEdit(id) {
  const name = document.getElementById(`editName-${id}`).value.trim();
  const boxId = parseInt(document.getElementById(`editBox-${id}`).value, 10);
  await sb.from('items').update({ name, box_id: boxId }).eq('id', id);
  loadLog(); loadCounts(); flashBin(boxId);
}

async function deleteItem(id) {
  if (!confirm('Permanently delete this item? This cannot be undone — use "remove" instead if it might come back.')) return;
  await sb.from('item_photos').delete().eq('item_id', id);
  await sb.from('items').delete().eq('id', id);
  loadLog();
  loadStreak();
}

async function loadStreak() {
  const { data } = await sb.from('items').select('created_at').eq('household_id', HH);
  if (!data) { document.getElementById('streakLine').textContent = ''; return; }
  const days = new Set(data.map(r => new Date(r.created_at).toDateString()));
  document.getElementById('streakLine').textContent = `${data.length} items sorted · ${days.size} active day${days.size===1?'':'s'}`;
  await loadCounts();
}

function escapeHtml(v) {
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function textColorFor(hex) {
  if (!hex) return '#000000';
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.55 ? '#111111' : '#ffffff';
}

function hexToArgb(hex) {
  const h = (hex || '#f2f2f2').replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  return 'FF' + full.toUpperCase();
}

async function exportCsv() {
  const { data } = await sb
    .from('items')
    .select('name, description, status, created_at, qty, box:box_id(name, color_hex)')
    .eq('household_id', HH)
    .order('created_at', { ascending: false })
    .limit(2000);
  if (!data || !data.length) return;

  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet('Housemaster');

  // Box first, then Item — matches how the boxes are actually used to find things.
  sheet.columns = [
    { header: 'Box', key: 'box', width: 24 },
    { header: 'Item', key: 'item', width: 32 },
    { header: 'Qty', key: 'qty', width: 8 },
    { header: 'Status', key: 'status', width: 14 },
    { header: 'Description', key: 'description', width: 48 },
    { header: 'Date', key: 'date', width: 22 }
  ];

  const headerRow = sheet.getRow(1);
  headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
  headerRow.eachCell(cell => {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF333333' } };
    cell.alignment = { vertical: 'middle' };
  });
  sheet.views = [{ state: 'frozen', ySplit: 1 }];

  data.forEach(it => {
    const bgHex = it.box && it.box.color_hex ? it.box.color_hex : '#f2f2f2';
    const fgHex = textColorFor(bgHex);
    const row = sheet.addRow({
      box: it.box ? it.box.name : '',
      item: it.name || '',
      qty: it.qty || 1,
      status: it.status || '',
      description: it.description || '',
      date: new Date(it.created_at).toLocaleString()
    });
    row.eachCell(cell => {
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: hexToArgb(bgHex) } };
      cell.font = { color: { argb: hexToArgb(fgHex) } };
      cell.alignment = { vertical: 'top', wrapText: true };
    });
  });

  const buf = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `housemaster_h${HH}_export_${Date.now()}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById('familyPicker').addEventListener('change', () => { selectedBinId = null; renderBinChips(); });

document.getElementById('boxPicker').addEventListener('change', updateBadge);

  openBoxPage(parseInt(t.dataset.box, 10));
});
document.getElementById('rapidBtn').addEventListener('click', () => { setRapid(!rapid); toast(rapid ? 'Rapid mode ON — saves by itself after 3 s' : 'Rapid mode OFF'); });
document.getElementById('undoBtn').addEventListener('click', undoLast);
document.getElementById('clearSearchBtn').addEventListener('click', () => {
  const i = document.getElementById('searchInput'); i.value = ''; setSearching(''); loadLog();
});
['boxPicker', 'itemNameInput', 'qtyInput'].forEach(id => ['focus', 'input', 'change'].forEach(ev => document.getElementById(id).addEventListener(ev, cancelCountdown)));
// --- voice search ---
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('micBtn');
  if (!SR) { btn.style.display = 'none'; return; }
  let rec = null;
  const overlay = document.getElementById('voiceOverlay'), said = document.getElementById('voiceSaid');
  const stop = () => { try { rec && rec.stop(); } catch (e) {} overlay.hidden = true; };
  document.getElementById('voiceStop').addEventListener('click', stop);
  btn.addEventListener('click', () => {
    rec = new SR();
    rec.lang = document.documentElement.lang === 'sk' ? 'sk-SK' : 'en-US';
    rec.interimResults = true; rec.maxAlternatives = 1;
    said.textContent = 'Say the item, e.g. “Where is the Sudocrem?”';
    overlay.hidden = false;
    rec.onresult = ev => {
      const r = ev.results[ev.results.length - 1];
      said.textContent = '“' + r[0].transcript + '”';
      if (r.isFinal) {
        const term = r[0].transcript.toLowerCase().replace(/^(where('s| is| are)?|find|look for|search( for)?|do (i|we) have)\s+(the|my|a|an|some)?\s*/i, '').replace(/[?.!]+$/, '').trim();
        stop();
        const i = document.getElementById('searchInput'); i.value = term; setSearching(term); searchItems(term);
        window.scrollTo({ top: document.getElementById('logTitle').offsetTop - 10, behavior: 'smooth' });
      }
    };
    rec.onerror = () => { said.textContent = 'Could not hear you. Tap the mic and try again.'; setTimeout(stop, 1500); };
    rec.onend = () => { setTimeout(() => { overlay.hidden = true; }, 300); };
    try { rec.start(); } catch (e) { stop(); }
  });
})();
document.getElementById('householdPicker').addEventListener('change', e => setHousehold(parseInt(e.target.value, 10)));
window.addEventListener('hashchange', () => { const h = readHousehold(); if (h !== HH) { document.getElementById('householdPicker').value = String(h); setHousehold(h); } });
setRapid(rapid);
loadHouseholds().then(() => loadBoxes()).then(() => { loadLog(); loadStreak(); });
