<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Housemaster — Oblečenie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:#f3f2f6; --card:#ffffff; --ink:#1c1a22; --sub:#5d5968; --line:#d9d5e2;
    --accent:#553a86; --accent-ink:#ffffff; --accent-soft:#e7e0f3; --ok:#2e7d32;
    --her:#c2185b; --child:#1e88e5;
    --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
    --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme:dark; --bg:#15131a; --card:#1f1c26; --ink:#ece9f2; --sub:#a7a1b4; --line:#37323f;
      --accent:#b59be4; --accent-ink:#1a1422; --accent-soft:#2e2640; --ok:#35b36b; --her:#e05598; --child:#4aa3f0; }
  }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 var(--body); padding-bottom:120px; }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px; padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px)); background:var(--bg); border-bottom:1px solid var(--line); }
  header h1 { flex:1; margin:0; font:700 1.6rem/1 var(--display); letter-spacing:.06em; text-transform:uppercase; }
  .lang { display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .lang button { border:none; background:var(--card); color:var(--sub); font:700 .8rem var(--mono); padding:6px 11px; cursor:pointer; }
  .lang button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  button, select { font:inherit; }
  .snap { display:block; width:100%; height:72px; border:none; border-radius:18px; background:#7c4dff; color:#fff; font:700 1.7rem var(--display); letter-spacing:.05em; cursor:pointer; }
  .sec { display:flex; align-items:center; gap:8px; margin:22px 0 10px; font:700 1.3rem var(--display); letter-spacing:.06em; text-transform:uppercase; }
  .sec .dot { width:12px; height:12px; border-radius:3px; }
  .sec small { margin-left:auto; font:500 .8rem var(--mono); color:var(--sub); text-transform:none; letter-spacing:0; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tile { position:relative; text-align:left; border:2px solid transparent; border-radius:12px; padding:9px 10px 10px; min-height:88px; cursor:pointer; color:#fff; display:flex; flex-direction:column; }
  .tile.her { background:var(--her); } .tile.child { background:var(--child); }
  .tile .id { font:800 1.5rem/1 var(--display); }
  .tile .nm { font:600 .78rem/1.2 var(--body); margin-top:4px; }
  .tile .n { position:absolute; top:7px; right:9px; font:700 .95rem var(--mono); }
  .tile.suggested { box-shadow:0 0 0 3px var(--bg), 0 0 0 6px #ffc53d; }
  .tile.suggested::after { content:"★"; position:absolute; bottom:6px; right:8px; color:#ffc53d; font-size:1.1rem; }
  .tile.selected { box-shadow:0 0 0 3px var(--bg), 0 0 0 6px var(--ok); transform:scale(1.03); }
  .tile.dim { opacity:.45; }
  .preview img { width:100%; max-height:48vh; object-fit:contain; background:#000; border-radius:14px; display:block; }
  .hint { color:var(--sub); font-size:.9rem; margin:6px 0 0; }
  .sug { margin-top:14px; border-radius:14px; padding:12px 14px; font:700 1.3rem/1.15 var(--display); letter-spacing:.04em; text-transform:uppercase; color:#fff; }
  .sug small { display:block; font:500 .8rem var(--body); text-transform:none; letter-spacing:0; opacity:.9; margin-bottom:2px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .item b { font-size:1rem; } .item .q { font:700 .85rem var(--mono); color:var(--sub); }
  .item .alt { display:block; color:var(--sub); font-size:.85rem; }
  .item small { display:block; color:var(--sub); font-size:.78rem; margin-top:3px; }
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--bg); border-top:1px solid var(--line); padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; }
  .bar > * { flex:1; height:62px; border-radius:16px; border:none; cursor:pointer; font:700 1.35rem var(--display); letter-spacing:.05em; }
  .home { background:#7c4dff; color:#fff; }
  .save { background:var(--ok); color:#fff; flex:2; }
  .cancel { background:var(--card); color:var(--ink); border:1px solid var(--line) !important; }
  .status { color:var(--sub); text-align:center; padding:40px 16px; font-size:1.05rem; }
  .spin { width:44px; height:44px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--accent); margin:0 auto 14px; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .boxhead { border-radius:16px; padding:16px; color:#fff; }
  .boxhead .id { font:800 3.4rem/.9 var(--display); }
  .boxhead .nm { font:700 1.25rem var(--body); } .boxhead .alt { opacity:.85; }
  .boxhead .st { font:500 .85rem var(--mono); margin-top:6px; }
  .back { border:none; background:rgba(0,0,0,.25); color:#fff; border-radius:99px; padding:8px 14px; font-weight:700; cursor:pointer; margin-bottom:10px; }
  .photo { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px; margin-bottom:12px; }
  .photo img { width:100%; border-radius:10px; display:block; cursor:zoom-in; }
  .photo label { display:block; color:var(--sub); font-size:.85rem; margin:8px 2px 4px; }
  .photo select { width:100%; height:46px; border-radius:10px; background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:0 10px; }
  .empty { color:var(--sub); padding:10px 2px; }
  dialog { border:0; padding:0; background:transparent; max-width:96vw; }
  dialog::backdrop { background:rgba(0,0,0,.85); }
  dialog img { max-width:96vw; max-height:88vh; border-radius:12px; display:block; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:600; z-index:30; display:none; }
  .toast.show { display:block; }
</style>
</head>
<body>
<header>
  <h1 id="title">Oblečenie</h1>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="sk">SK</button><button type="button" data-lang="en">EN</button></div>
</header>
<main id="app"></main>
<div class="bar" id="bar"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<dialog id="viewer"><img id="viewerImg" alt=""></dialog>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://clteinrzpebrkrkthsvx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsdGVpbnJ6cGVicmtya3Roc3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3ODU0MTUsImV4cCI6MjEwNTM2MTQxNX0.EO4rB4sMIEwLlUlec2Ep4MB9a47vF0r_zflUOzdJX9Y";
const BUCKET = 'clothes-photos';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app'), bar = document.getElementById('bar'), cam = document.getElementById('cam');

// Same household + language the main app last used on this phone
let HH = 2, lang = 'sk';
try { HH = parseInt(localStorage.getItem('hm_household'), 10) || 2; lang = localStorage.getItem('hm_lang') || 'sk'; } catch (e) {}
const HOME_URL = '/#h' + HH;

const T = {
  sk: { title:'Oblečenie', snap:'📷 ODFOTIŤ OBLEČENIE', her:'Ona', child:'Dieťa', pcs:'ks', home:'⌂ ÚVOD',
        analyzing:'Analyzujem fotku…', saving:'Ukladám…', suggested:'Návrh', pick:'Ak návrh nesedí, ťukni na správny box.', found:'Nájdené kusy',
        save:'✓ ULOŽIŤ DO', cancel:'ZRUŠIŤ', back:'← Späť', photos:'Fotky', list:'Obsah', empty:'Zatiaľ prázdne',
        error:'Chyba — skús znova', move:'Presunúť fotku do:', loading:'Načítavam…', saved:b=>`Uložené do ${b}`, moved:b=>`Presunuté do ${b}`, cond:{ 'new':'nové', 'used':'nosené', 'worn out':'opotrebované' } },
  en: { title:'Clothes', snap:'📷 PHOTOGRAPH CLOTHES', her:'Her', child:'Child', pcs:'pcs', home:'⌂ HOME',
        analyzing:'Analyzing photo…', saving:'Saving…', suggested:'Suggested', pick:'If the suggestion is wrong, tap the right box.', found:'Items found',
        save:'✓ SAVE TO', cancel:'CANCEL', back:'← Back', photos:'Photos', list:'Contents', empty:'Empty so far',
        error:'Error — try again', move:'Move photo to:', loading:'Loading…', saved:b=>`Saved to ${b}`, moved:b=>`Moved to ${b}`, cond:{ 'new':'new', 'used':'used', 'worn out':'worn out' } }
};
const t = k => T[lang][k];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boxName = b => lang === 'sk' ? b.name_sk : b.name_en;
const boxAlt = b => lang === 'sk' ? b.name_en : b.name_sk;
const itemName = i => (lang === 'sk' ? i.name_sk : i.name_en) || i.name_en || i.name_sk || '';
const itemAlt = i => { const a = lang === 'sk' ? i.name_en : i.name_sk; return a && a !== itemName(i) ? a : ''; };

let boxes = [], currentView = { name:'home' };

function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2400); }
function ding() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), tt = a.currentTime;
    [[880,0],[1320,.12]].forEach(([f,d]) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f;
      g.gain.setValueAtTime(.0001, tt+d); g.gain.exponentialRampToValueAtTime(.35, tt+d+.02); g.gain.exponentialRampToValueAtTime(.0001, tt+d+.25);
      o.connect(g); g.connect(a.destination); o.start(tt+d); o.stop(tt+d+.3); }); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
}
function homeBar() { bar.innerHTML = `<button class="home" id="homeBtn">${t('home')}</button>`; document.getElementById('homeBtn').onclick = () => { location.href = HOME_URL; }; }

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('hm_lang', lang); } catch (e) {} rerender(); });
document.getElementById('viewer').onclick = e => e.currentTarget.close();

function setHeader() {
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = t('title');
  document.title = 'Housemaster — ' + t('title');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
function rerender() {
  setHeader();
  if (currentView.name === 'home') renderHome();
  else if (currentView.name === 'box') renderBox(currentView.boxId);
  else if (currentView.name === 'review') renderReview(currentView.data);
}
function status(msg, spin) { app.innerHTML = `<div class="status">${spin ? '<div class="spin"></div>' : ''}${esc(msg)}</div>`; }

async function loadBoxes() {
  const { data: b, error } = await sb.from('clothes_boxes').select('*').order('sort_order');
  if (error) throw error;
  const { data: items } = await sb.from('clothes_items').select('box_id, qty').eq('household_id', HH);
  const counts = {};
  (items || []).forEach(i => counts[i.box_id] = (counts[i.box_id] || 0) + (i.qty || 1));
  boxes = b.map(x => ({ ...x, count: counts[x.id] || 0 }));
}
function tilesHtml(owner, opts = {}) {
  return `<div class="grid">${boxes.filter(b => b.owner === owner).map(b => `
    <button type="button" class="tile ${b.owner} ${opts.suggested === b.id ? 'suggested' : ''} ${opts.selected === b.id ? 'selected' : ''} ${opts.selected && opts.selected !== b.id ? 'dim' : ''}" data-box="${b.id}">
      <span class="id">${b.id}</span><span class="n">${b.count}</span><span class="nm">${esc(boxName(b))}</span>
    </button>`).join('')}</div>`;
}
function allTiles(opts) {
  const sum = o => boxes.filter(b => b.owner === o).reduce((s, b) => s + b.count, 0);
  return `<div class="sec"><span class="dot" style="background:var(--her)"></span>${t('her')}<small>${sum('her')} ${t('pcs')}</small></div>${tilesHtml('her', opts)}
          <div class="sec"><span class="dot" style="background:var(--child)"></span>${t('child')}<small>${sum('child')} ${t('pcs')}</small></div>${tilesHtml('child', opts)}`;
}

/* ---------- HOME ---------- */
async function renderHome() {
  currentView = { name:'home' }; setHeader(); homeBar();
  status(t('loading'), true);
  try { await loadBoxes(); } catch (e) { console.error(e); return status(t('error')); }
  app.innerHTML = `<button type="button" class="snap" id="snapBtn">${t('snap')}</button>${allTiles({})}`;
  document.getElementById('snapBtn').onclick = () => cam.click();
  app.querySelectorAll('.tile').forEach(el => el.onclick = () => renderBox(el.dataset.box));
}

/* ---------- PHOTO → ANALYZE ---------- */
cam.onchange = async () => {
  const file = cam.files[0]; cam.value = '';
  if (!file) return;
  status(t('analyzing'), true);
  try {
    const { blob, b64 } = await compress(file);
    const r = await fetch('/api/clothes-analyze', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ imageBase64: b64, mediaType:'image/jpeg' }) });
    const result = await r.json();
    if (!r.ok) throw new Error(result.error);
    if (!boxes.length) await loadBoxes();
    renderReview({ blob, previewUrl: URL.createObjectURL(blob), result, selected: result.suggested_box });
  } catch (e) { console.error(e); status(t('error')); setTimeout(renderHome, 1800); }
};
async function compress(file, max = 1600, quality = 0.8) {
  let img; try { img = await createImageBitmap(file, { imageOrientation:'from-image' }); } catch (e) { img = await createImageBitmap(file); }
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', quality));
  const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
  return { blob, b64 };
}

/* ---------- REVIEW ---------- */
function renderReview(data) {
  currentView = { name:'review', data }; setHeader();
  const { previewUrl, result, selected } = data;
  const sug = boxes.find(b => b.id === result.suggested_box);
  const sel = boxes.find(b => b.id === selected);
  app.innerHTML = `
    <div class="preview"><img src="${previewUrl}" alt=""></div>
    ${sug ? `<div class="sug" style="background:var(--${sug.owner})"><small>★ ${t('suggested')}</small>${sug.id} · ${esc(boxName(sug))}</div>` : ''}
    <p class="hint">${t('pick')}</p>
    ${allTiles({ suggested: result.suggested_box, selected })}
    <div class="sec">${t('found')}<small>${result.items.reduce((s, i) => s + (i.qty || 1), 0)} ${t('pcs')}</small></div>
    ${result.items.map(itemHtml).join('') || `<div class="empty">—</div>`}`;
  app.querySelectorAll('.tile').forEach(el => el.onclick = () => renderReview({ ...data, selected: el.dataset.box }));
  bar.innerHTML = `<button class="cancel" id="cancelBtn">${t('cancel')}</button><button class="save" id="saveBtn">${t('save')} ${esc(selected)}</button>`;
  document.getElementById('cancelBtn').onclick = renderHome;
  document.getElementById('saveBtn').onclick = () => save(data);
  window.scrollTo(0, 0);
}
function itemHtml(i) {
  const cond = (t('cond') || {})[i.condition] || i.condition || '';
  return `<div class="item"><b>${esc(itemName(i))}</b> ${i.qty > 1 ? `<span class="q">× ${i.qty}</span>` : ''}${itemAlt(i) ? `<span class="alt">${esc(itemAlt(i))}</span>` : ''}
    <small>${[i.color, i.size, i.brand, cond].filter(Boolean).map(esc).join(' · ')}</small>
    ${i.keywords ? `<small>${esc(i.keywords)}</small>` : ''}</div>`;
}
async function save({ blob, result, selected }) {
  status(t('saving'), true); bar.innerHTML = '';
  try {
    const path = `${HH}/${selected}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/jpeg' });
    if (up.error) throw up.error;
    const { data: photo, error: pErr } = await sb.from('clothes_photos')
      .insert({ box_id: selected, storage_path: path, suggested_box_id: result.suggested_box, household_id: HH }).select().single();
    if (pErr) throw pErr;
    if (result.items.length) {
      const rows = result.items.map(i => ({ photo_id: photo.id, box_id: selected, household_id: HH,
        name_en: i.name_en, name_sk: i.name_sk, color: i.color, size: i.size, brand: i.brand, qty: i.qty || 1, condition: i.condition, keywords: i.keywords }));
      const { error: iErr } = await sb.from('clothes_items').insert(rows);
      if (iErr) throw iErr;
    }
    ding();
    await loadBoxes();
    const b = boxes.find(x => x.id === selected);
    toast(t('saved')(`${selected} · ${b ? boxName(b) : ''}`));
    renderBox(selected);
  } catch (e) { console.error(e); status(t('error')); setTimeout(renderHome, 1800); }
}

/* ---------- BOX VIEW ---------- */
async function renderBox(boxId) {
  currentView = { name:'box', boxId }; setHeader(); homeBar();
  status(t('loading'), true);
  if (!boxes.length) await loadBoxes();
  const box = boxes.find(b => b.id === boxId);
  const [{ data: photos }, { data: items }] = await Promise.all([
    sb.from('clothes_photos').select('*').eq('box_id', boxId).eq('household_id', HH).order('created_at', { ascending:false }),
    sb.from('clothes_items').select('*').eq('box_id', boxId).eq('household_id', HH).order('created_at', { ascending:false })
  ]);
  const urls = {};
  if (photos && photos.length) {
    const { data: signed } = await sb.storage.from(BUCKET).createSignedUrls(photos.map(p => p.storage_path), 3600);
    (signed || []).forEach((s, i) => urls[photos[i].id] = s.signedUrl);
  }
  const total = (items || []).reduce((s, i) => s + (i.qty || 1), 0);
  const moveOptions = cur => boxes.map(b => `<option value="${b.id}" ${b.id === cur ? 'selected' : ''}>${b.id} – ${esc(boxName(b))}</option>`).join('');
  app.innerHTML = `
    <div class="boxhead" style="background:var(--${box ? box.owner : 'her'})">
      <button type="button" class="back" id="backBtn">${t('back')}</button>
      <div class="id">${esc(boxId)}</div><div class="nm">${esc(box ? boxName(box) : '')}</div>${box ? `<div class="alt">${esc(boxAlt(box))}</div>` : ''}
      <div class="st">${total} ${t('pcs')} · ${photos ? photos.length : 0} ${t('photos').toLowerCase()}</div>
    </div>
    <div class="sec">${t('list')}<small>${total} ${t('pcs')}</small></div>
    ${items && items.length ? items.map(itemHtml).join('') : `<div class="empty">${t('empty')}</div>`}
    <div class="sec">${t('photos')}<small>${photos ? photos.length : 0}</small></div>
    ${(photos || []).map(p => `
      <div class="photo">
        <img src="${urls[p.id] || ''}" data-full="${urls[p.id] || ''}" alt="" loading="lazy">
        <label>${t('move')}</label>
        <select data-photo="${p.id}">${moveOptions(boxId)}</select>
      </div>`).join('')}`;
  document.getElementById('backBtn').onclick = renderHome;
  app.querySelectorAll('.photo img').forEach(img => img.onclick = () => { document.getElementById('viewerImg').src = img.dataset.full; document.getElementById('viewer').showModal(); });
  app.querySelectorAll('select[data-photo]').forEach(sel => sel.onchange = async () => {
    const to = sel.value, id = sel.dataset.photo;
    status(t('saving'), true);
    await sb.from('clothes_photos').update({ box_id: to }).eq('id', id);
    await sb.from('clothes_items').update({ box_id: to }).eq('photo_id', id);
    await loadBoxes();
    const b = boxes.find(x => x.id === to); toast(t('moved')(`${to} · ${b ? boxName(b) : ''}`)); ding();
    renderBox(boxId);
  });
  window.scrollTo(0, 0);
}

// Phone Back: go up one level inside the module instead of leaving
history.replaceState({ c:'root' }, ''); history.pushState({ c:'guard' }, '');
window.addEventListener('popstate', () => {
  if (document.getElementById('viewer').open) document.getElementById('viewer').close();
  else if (currentView.name !== 'home') renderHome();
  else { location.href = HOME_URL; return; }
  history.pushState({ c:'guard' }, '');
});

setHeader();
renderHome();
</script>
</body>
</html>
